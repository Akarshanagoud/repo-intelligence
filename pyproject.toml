[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repointel"
version = "0.1.0"
description = "AI-assisted codebase analysis: semantic code search, architecture discovery and developer insights"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["code-search", "static-analysis", "architecture", "developer-tools", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.4", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
repointel = "repointel.cli:main"

[project.urls]
Homepage = "https://github.com/Akarshanagoud/repo-intelligence"
Issues = "https://github.com/Akarshanagoud/repo-intelligence/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repointel = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["repointel"]
branch = true
