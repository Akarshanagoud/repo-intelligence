<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codebase Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233d4fd6'/%3E%3Cpath d='M12 10l-6 6 6 6M20 10l6 6-6 6' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="kit.css">
  <style>
    :root { --accent: #3d4fd6; --accent-text: #3d4fd6; --accent-wash: rgba(61, 79, 214, 0.1); }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) { --accent-text: #9aa6f5; --accent-wash: rgba(154, 166, 245, 0.15); }
    }
    :root[data-theme="dark"] { --accent-text: #9aa6f5; --accent-wash: rgba(154, 166, 245, 0.15); }
    .code { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; overflow: auto; }
    .code .ln { display: grid; grid-template-columns: 48px 1fr; }
    .code .ln > span:first-child { color: var(--muted); text-align: right; padding-right: 12px; user-select: none; border-right: 1px solid var(--border); }
    .code .ln > span:last-child { padding-left: 12px; white-space: pre; }
    .code .ln.hl { background: var(--accent-wash); }
    .code .ln.hl > span:first-child { color: var(--accent-text); font-weight: 600; }
    .hit { border-top: 1px solid var(--border); padding: 14px 18px; }
    .hit:first-child { border-top: 0; }
    .hit .code { margin-top: 8px; max-height: 260px; }
    .tag { font-size: 11px; color: var(--ink-2); background: var(--surface-2); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
    .graph-wrap { overflow: auto; border-radius: 8px; }
    .graph-wrap svg text { fill: var(--ink); font: 12px var(--font); }
    .graph-wrap .node rect { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1; }
    .graph-wrap .node.hub rect { stroke: var(--accent); stroke-width: 1.5; }
    .graph-wrap .node .sub { fill: var(--muted); font-size: 11px; }
    .graph-wrap .edge { fill: none; stroke: var(--axis); stroke-width: 1.2; }
    .graph-wrap.focus .edge { opacity: 0.12; }
    .graph-wrap.focus .node { opacity: 0.35; }
    .graph-wrap .edge.out { stroke: var(--series-1); opacity: 1; stroke-width: 1.8; }
    .graph-wrap .edge.in { stroke: var(--series-2); opacity: 1; stroke-width: 1.8; }
    .graph-wrap .node.on { opacity: 1; }
    .graph-wrap .node { cursor: pointer; }
    .outline { max-height: 640px; overflow: auto; }
    .file-list { max-height: 640px; overflow: auto; }
    @media (max-width: 1100px) { #files-grid { grid-template-columns: minmax(0, 1fr) !important; } .file-list { max-height: 260px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/overview"><span class="brand-mark" aria-hidden="true">RI</span><span class="brand-name">Codebase Explorer</span><span class="brand-sub">repointel</span></a>
      <nav class="nav" id="nav" aria-label="Sections"></nav>
      <div class="topbar-right">
        <span class="env-pill" id="env">connecting</span>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Theme"></button>
      </div>
    </div>
  </header>
  <main class="page" id="app"></main>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
